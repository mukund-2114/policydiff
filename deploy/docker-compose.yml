name: policydiff

# Settings shared by the api and the worker. Both run the same image.
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  EMBED_DIMS: ${EMBED_DIMS:-1536}
  MODELS_CONFIG: /config/models.yaml

services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports published: only other containers on this network can reach the database.

  api:
    restart: unless-stopped
    build: ../api
    environment: *api-env
    volumes:
      - ../models.yaml:/config/models.yaml:ro
      - files:/data/files
      # Demo documents, read-only. Remove this line to switch the sample features off.
      - ../evals/northwind:/samples:ro
    depends_on:
      db:
        condition: service_healthy
    # The api runs the database migrations on start, so it is healthy only after they finish.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp

  # Does the slow work (parsing now, chunking and embedding later) so the web page never waits.
  worker:
    restart: unless-stopped
    build: ../api
    command: ["python", "-m", "procrastinate", "--app=app.jobs.queue", "worker"]
    environment: *api-env
    volumes:
      - ../models.yaml:/config/models.yaml:ro
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  web:
    restart: unless-stopped
    build: ../web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    read_only: true
    tmpfs:
      - /data
      - /config

volumes:
  pgdata:
  files:
