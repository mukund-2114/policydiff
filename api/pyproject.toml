[project]
name = "policydiff-api"
version = "0.1.0"
description = "Policy Diff API"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pgvector",
    "uuid-utils",
    "argon2-cffi",
    "itsdangerous",
    "pyyaml",
    "httpx",
    "openai",
    "anthropic",
    "procrastinate>=3.10.0",
    "pymupdf<2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned so a new ruff release cannot add rules and break CI. B008 is off because FastAPI
# needs Depends(...) in argument defaults.
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
