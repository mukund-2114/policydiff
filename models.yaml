# Picks the provider and model for each job. Keys come from environment variables, never from this file.
# Chat providers: openai, anthropic, bedrock, openai_compatible (needs base_url), ollama.
# Reranker providers: local, llm (the chat model), cohere. The Settings page overrides this file.
chat:
  provider: openai
  model: gpt-5-mini
embed:
  provider: openai
  model: text-embedding-3-small
  dims: 1536
# local: a small cross-encoder that runs in the container, nothing is sent out (downloads once).
# llm: the chat model scores all candidates in one call. cohere: hosted Cohere Rerank (needs COHERE_API_KEY).
rerank:
  provider: local
vision:
  provider: openai
  model: gpt-5-mini
egress:
  # false refuses to start any adapter whose base URL is not a private address.
  allow_cloud: true
  log_payloads: false
